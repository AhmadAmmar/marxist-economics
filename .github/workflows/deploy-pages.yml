name: Deploy MkDocs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install pandoc
        run: |
          curl -sL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/2.12/pandoc-2.12-1-amd64.deb
          sudo dpkg -i pandoc.deb
      - name: Generate the web pages from LaTeX
        run: |
          python tools/sialkot.py
          python tools/tex_to_web.py
      - name: Check that the PDF, LaTeX, web pages and shared figures agree
        run: python tools/check_sync.py
      - name: Test the equations
        run: |
          python -m pip install pytest
          python -m pytest tests -q
      - name: Build site
        run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
