name: Deploy MkDocs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install pandoc, LaTeX and Poppler
        run: |
          curl -sL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/2.12/pandoc-2.12-1-amd64.deb
          sudo dpkg -i pandoc.deb
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-science texlive-pictures cm-super
      - name: Test the equations
        run: |
          python -m pip install pytest
          python -m pytest tests -q
      - name: Build everything from source and check it
        run: python tools/build_all.py --site --no-carousel
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
